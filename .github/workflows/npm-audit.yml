name: npm audit

on:
  schedule:
    - cron: '37 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Audit production vulnerabilities
        run: |
          npm audit --omit=dev --audit-level=moderate --json > audit-report.json || true
          npm audit --omit=dev --audit-level=moderate || true
          node -e '
            const report = require("./audit-report.json");
            // Exemption: node-forge (all versions) is affected by GHSA-86w9-cpqp-85rv
            // (RSA PKCS#1 v1.5 signature verification) with no patched release, pulled
            // in by @earendil-works/gondolin. Exempt this single advisory, including
            // packages that only depend on it, until upstream ships a fix.
            const EXEMPT_URL = "GHSA-86w9-cpqp-85rv";
            const vulns = report.vulnerabilities ?? {};
            const removed = new Set();
            for (const [name, v] of Object.entries(vulns)) {
              const advs = (v.via ?? []).filter(x => typeof x === "object");
              if (advs.length > 0 && advs.every(a => (a.url ?? "").includes(EXEMPT_URL))) removed.add(name);
            }
            let changed = true;
            while (changed) {
              changed = false;
              for (const [name, v] of Object.entries(vulns)) {
                if (removed.has(name)) continue;
                const vias = v.via ?? [];
                if (vias.length > 0 && vias.every(x => typeof x === "string" && removed.has(x))) { removed.add(name); changed = true; }
              }
            }
            const remaining = Object.keys(vulns).filter(n => !removed.has(n));
            if (remaining.length) {
              console.error("Unresolved vulnerabilities:", remaining.join(", "));
              process.exit(1);
            }
            console.log("Audit clean. Exempted advisories only:", [...removed].join(", "));
          '

      - name: Verify registry signatures
        run: npm audit signatures --omit=dev
